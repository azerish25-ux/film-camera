name: BMC Xcode project generation
on:
  push:
    branches: [bmc-integration]
    paths: ['project.yml', 'FilmCamera/**', 'FilmCameraTests/**', '.github/workflows/bmc-project-validation.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bmc-project-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned XcodeGen and generate project
        env:
          USER: runner
        run: |
          git clone --depth 1 --branch 2.46.0 https://github.com/yonaskolb/XcodeGen.git /tmp/XcodeGen
          test "$(git -C /tmp/XcodeGen rev-parse HEAD)" = 8445e778451c7e44237b90281bde622d764b0084
          swift build --package-path /tmp/XcodeGen -c release --product xcodegen
          /tmp/XcodeGen/.build/release/xcodegen generate --spec project.yml
          grep -q 'BMCLUTCatalog.swift in Sources' FilmCamera.xcodeproj/project.pbxproj
          grep -q 'rec709-luminance.bin in Resources' FilmCamera.xcodeproj/project.pbxproj
          grep -q 'bmc-luts.json in Resources' FilmCamera.xcodeproj/project.pbxproj
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bmc-generated-xcode-project
          path: FilmCamera.xcodeproj/
          retention-days: 14
      - name: Save generated project if branch has not moved
        if: ${{ success() && github.ref == 'refs/heads/bmc-integration' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin bmc-integration
          if ! git diff --quiet HEAD FETCH_HEAD -- project.yml FilmCamera FilmCameraTests FilmCameraUITests; then
            echo 'Source changed during generation; a later run must regenerate the project.'
            exit 0
          fi
          git merge --ff-only FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- FilmCamera.xcodeproj
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh generated BMC Xcode project"
            git push origin HEAD:bmc-integration
          fi
