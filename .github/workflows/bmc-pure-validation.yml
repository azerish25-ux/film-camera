name: BMC portable Swift validation
on:
  push:
    branches: [bmc-integration]
    paths: ['FilmCamera/App.swift', 'FilmCamera/BMCAudioMeter.swift', 'FilmCamera/BMCTimecode.swift', 'FilmCamera/BMCSignaling.swift', 'FilmCamera/Resources/BMCLUTs/**', 'scripts/bmc-pure/PureLogicMain.swift', '.github/workflows/bmc-pure-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bmc-pure-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise portable logic
        run: |
          swiftc -frontend -parse FilmCamera/App.swift
          swiftc -swift-version 5 FilmCamera/BMCAudioMeter.swift FilmCamera/BMCTimecode.swift FilmCamera/BMCSignaling.swift scripts/bmc-pure/PureLogicMain.swift -o /tmp/bmc-pure-check
          /tmp/bmc-pure-check
