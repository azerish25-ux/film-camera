name: BMC WebKit WebRTC diagnostic
on:
  push:
    branches: [diagnostics/bmc-webrtc-webkit]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate project and probe a local data channel
        run: |
          set -o pipefail
          cp scripts/bmc-signaling/BMCWebRTCWebKitProbeTests.swift FilmCameraTests/
          brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -quiet -parallel-testing-enabled NO -scheme FilmCamera -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/webrtc -resultBundlePath build/WebRTC.xcresult -only-testing:FilmCameraTests/BMCWebRTCWebKitProbeTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee webrtc-test.log
      - name: Show test summary
        if: always()
        run: |
          if [ -d build/WebRTC.xcresult ]; then xcrun xcresulttool get test-results summary --path build/WebRTC.xcresult || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bmc-webrtc-webkit-probe
          path: |
            webrtc-test.log
            build/WebRTC.xcresult
