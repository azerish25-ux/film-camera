name: Swift validation
on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Verification scope
        type: choice
        default: all
        options: [all, integration, processing, functional]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen librsvg && rsvg-convert -o FilmCamera/Assets.xcassets/AppIcon.appiconset/AppIcon.png FilmCamera/Resources/app-icon.svg && xcodegen generate
      - name: Compile and exercise iPhone app
        env:
          TEST_SUITE: ${{ inputs.test_suite }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          ONLY=()
          if [ "$TEST_SUITE" != all ]; then
            ONLY=(-only-testing:FilmCameraTests/OriginalAssetTests/testEveryFilmThroughProductionPipelineAgainstAndroidChain -only-testing:FilmCameraTests/OriginalAssetTests/testFogVariesIndependentlyOfFilmBreath -only-testing:FilmCameraTests/OriginalAssetTests/testFastShakeUsesOriginalThreeSampleBuffer -only-testing:FilmCameraTests/OriginalAssetTests/testSubthresholdGrainUsesAndroidBypass -only-testing:FilmCameraTests/OriginalAssetTests/testAnimatedFramesChangeAndSeekBackToOriginalPixels -only-testing:FilmCameraTests/MediaExportTests)
          fi
          if [ "$TEST_SUITE" = processing ]; then ONLY+=(-only-testing:FilmCameraTests/AndroidParityTests); fi
          if [ "$TEST_SUITE" = processing ] || [ "$TEST_SUITE" = functional ]; then
            ONLY+=(-only-testing:FilmCameraTests/OriginalAssetTests/testEveryAdjustmentChangesRenderedPhotoWhenItsEffectIsEnabled -only-testing:FilmCameraTests/OriginalAssetTests/testFractionalPreviewUsesIntegralRasterBounds -only-testing:FilmCameraUITests)
          fi
          xcodebuild -quiet "${ONLY[@]}" -parallel-testing-enabled NO -project FilmCamera.xcodeproj -scheme FilmCamera -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/SwiftTests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee swift-validation.log
      - name: Export visual test evidence
        if: always()
        run: |
          if [ -d build/SwiftTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/SwiftTests.xcresult --output-path build/attachments
            xcrun xcresulttool get --legacy --format json --path build/SwiftTests.xcresult > build/failure-summary.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-validation
          path: |
            FilmCamera.xcodeproj
            build/attachments
            build/failure-summary.json
            build/SwiftTests.xcresult
            swift-validation.log
          retention-days: 7
