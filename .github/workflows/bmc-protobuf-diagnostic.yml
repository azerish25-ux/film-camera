name: BMC protobuf generation diagnostic
on:
  push:
    branches: [diagnostics/bmc-protobuf]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc and build the pinned Swift generator
        run: |
          apt-get update -qq
          apt-get install -y -qq protobuf-compiler
          git clone --quiet https://github.com/apple/swift-protobuf.git /tmp/swift-protobuf
          git -C /tmp/swift-protobuf checkout --quiet d72aed98f8253ec1aa9ea1141e28150f408cf17f
          cd /tmp/swift-protobuf
          swift build -c release --product protoc-gen-swift
      - name: Generate and compile recovered messages
        run: |
          mkdir -p /tmp/bmc-check/Generated
          protoc --descriptor_set_in=Reference/BMC/bmc-v5.pb --plugin=protoc-gen-swift=/tmp/swift-protobuf/.build/release/protoc-gen-swift --swift_out=/tmp/bmc-check/Generated common.proto camera_control.proto settings.proto main_messages.proto
          protoc --descriptor_set_in=Reference/BMCProtocol/bmc-media-sync-v1.pb --plugin=protoc-gen-swift=/tmp/swift-protobuf/.build/release/protoc-gen-swift --swift_out=/tmp/bmc-check/Generated media_sync.proto
          cat > /tmp/bmc-check/Package.swift <<'EOF'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(name: "BMCProtocolCheck", dependencies: [.package(path: "../swift-protobuf")], targets: [.target(name: "BMCProtocolCheck", dependencies: [.product(name: "SwiftProtobuf", package: "swift-protobuf")], path: "Generated"), .testTarget(name: "BMCProtocolTests", dependencies: ["BMCProtocolCheck", .product(name: "SwiftProtobuf", package: "swift-protobuf")], path: "Tests")])
          EOF
          mkdir -p /tmp/bmc-check/Tests
          cp scripts/bmc-protobuf/ProtocolTests.swift /tmp/bmc-check/Tests/
          cp scripts/bmc-protobuf/ReceiverTests.swift /tmp/bmc-check/Tests/
          cp scripts/bmc-protobuf/TransferTests.swift /tmp/bmc-check/Tests/
          cp scripts/bmc-protobuf/CatalogTests.swift /tmp/bmc-check/Tests/
          cp scripts/bmc-protobuf/SignalingTests.swift /tmp/bmc-check/Tests/
          cp scripts/bmc-protobuf/BMCControlMessages.swift /tmp/bmc-check/Generated/
          cp scripts/bmc-protobuf/BMCMediaChecksum.swift /tmp/bmc-check/Generated/
          cp scripts/bmc-protobuf/BMCMediaReceiver.swift scripts/bmc-protobuf/PortError.swift /tmp/bmc-check/Generated/
          cp scripts/bmc-protobuf/BMCMediaTransfer.swift /tmp/bmc-check/Generated/
          cp scripts/bmc-protobuf/BMCMediaCatalog.swift /tmp/bmc-check/Generated/
          cp scripts/bmc-protobuf/BMCSignaling.swift scripts/bmc-protobuf/BMCClientHandshake.swift scripts/bmc-protobuf/BMCSignalingSession.swift scripts/bmc-protobuf/AuthStub.swift /tmp/bmc-check/Generated/
          cd /tmp/bmc-check
          swift test
          cp -R Generated "$GITHUB_WORKSPACE/bmc-protobuf-generated"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bmc-protobuf-generated
          path: bmc-protobuf-generated/
          if-no-files-found: warn
