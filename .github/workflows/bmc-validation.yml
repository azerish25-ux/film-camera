name: BMC integration validation
on:
  push:
    branches: [bmc-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build and test on iPhone simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -quiet -parallel-testing-enabled NO -scheme FilmCamera -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/BMC.xcresult -only-testing:FilmCameraTests/BMCMonitorTests -only-testing:FilmCameraTests/BMCSlateTests -only-testing:FilmCameraTests/BMCGuideTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee bmc-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bmc-validation
          path: |
            build/BMC.xcresult
            bmc-test.log
