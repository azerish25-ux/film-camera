name: Swift validation
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen librsvg && rsvg-convert -o FilmCamera/Assets.xcassets/AppIcon.appiconset/AppIcon.png FilmCamera/Resources/app-icon.svg && xcodegen generate
      - name: Compile and exercise iPhone app
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -quiet -parallel-testing-enabled NO -project FilmCamera.xcodeproj -scheme FilmCamera -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/SwiftTests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee swift-validation.log
      - name: Export visual test evidence
        if: always()
        run: |
          if [ -d build/SwiftTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/SwiftTests.xcresult --output-path build/attachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-validation
          path: |
            build/attachments
            build/SwiftTests.xcresult
            swift-validation.log
          retention-days: 7
