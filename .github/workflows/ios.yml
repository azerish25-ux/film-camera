name: iOS macOS validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-reference:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-reference/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-reference
          path: android-reference/
  build-test:
    needs: android-reference
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-reference
          path: FilmCamera/Resources/AndroidReference
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          rm -f FilmCamera/Resources/AndroidReference/reference-cases.json
          xcodegen generate
          xcodebuild -version
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project FilmCamera.xcodeproj -scheme FilmCamera -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee device-build.log
      - name: Test in iPhone simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcodebuild -project FilmCamera.xcodeproj -scheme FilmCamera -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee simulator-test.log
      - name: Package project and applications
        if: always()
        run: |
          mkdir -p build/deliverables
          cp -R FilmCamera.xcodeproj build/deliverables/
          if [ -d build/device/Build/Products/Debug-iphoneos/FilmCamera.app ]; then
            mkdir -p build/unsigned/Payload
            cp -R build/device/Build/Products/Debug-iphoneos/FilmCamera.app build/unsigned/Payload/
            (cd build/unsigned && zip -qry ../deliverables/FilmCamera-unsigned.ipa Payload)
          fi
          if [ -d build/simulator/Build/Products/Debug-iphonesimulator/FilmCamera.app ]; then
            ditto -c -k --sequesterRsrc --keepParent build/simulator/Build/Products/Debug-iphonesimulator/FilmCamera.app build/deliverables/FilmCamera-simulator.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation
          path: |
            build/deliverables
            build/Tests.xcresult
            device-build.log
            simulator-test.log
          retention-days: 14
